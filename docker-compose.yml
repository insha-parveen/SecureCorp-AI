version: "3.8"
services:
  db:
    image: postgres:15-alpine
    container_name: securecorp-ai-db
    restart: always
    environment:
      POSTGRES_USER: nexacore_admin
      POSTGRES_PASSWORD: nexacore_password0506
      POSTGRES_DB: nexacore_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: securecorp-ai-redis
    restart: always
    ports:
      - "6379:6379"

volumes:
  postgres_data:
