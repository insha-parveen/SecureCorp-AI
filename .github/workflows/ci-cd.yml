name: CI/CD Pipeline

# Deploy topology: frontend on Vercel (via Vercel's own Git integration),
# backend API on Railway (Dockerfile builder, see railway.toml). This workflow
# runs the test gates on every PR/push and deploys the backend to Railway on
# main. The frontend is NOT deployed here — Vercel builds and deploys web/
# automatically on push. In Vercel's project settings, set:
#   NEXT_PUBLIC_API_BASE = https://<your-backend>.up.railway.app   (Production)
# and on the Railway backend service set the split-domain cookie/CORS vars:
#   HYBRIDRAG_AUTH_COOKIE_SAMESITE=none
#   HYBRIDRAG_AUTH_COOKIE_SECURE=true
#   HYBRIDRAG_AUTH_COOKIE_DOMAIN=            (empty)
#   HYBRIDRAG_CORS_ORIGINS=["https://<your-frontend>.vercel.app"]

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # Python Backend Tests
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          # $GITHUB_PATH persists PATH to *subsequent* steps; a bare `export`
          # in this step would not survive into the next one.
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install Dependencies
        run: uv sync --extra api --extra retrieval --frozen

      - name: Run Backend Tests
        run: uv run pytest tests/ -x -v --ignore=tests/evaluation --ignore=tests/security
        env:
          HYBRIDRAG_CHROMA_CLOUD: "false"
          HYBRIDRAG_CACHE_ENABLED: "false"

  # Frontend Lint, Typecheck, and Unit Tests (the PR gate; Vercel does the deploy)
  frontend-test:
    name: Frontend Test & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install Dependencies
        run: cd web && npm ci

      - name: Run Lint
        run: cd web && npm run lint

      - name: Run Type Check
        run: cd web && npm run typecheck

      - name: Run Tests
        run: cd web && npm test

  # Deploy the backend API to Railway on main. Railway builds the image from
  # the Dockerfile per railway.toml — no external registry is involved.
  deploy-backend:
    name: Deploy Backend (Railway)
    needs: [backend-test, frontend-test]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Railway Deploy Backend
        run: railway up --service securecorp-backend --ci
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
