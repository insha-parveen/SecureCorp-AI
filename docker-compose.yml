version: "3.8"
services:
  db:
    image: postgres:15-alpine
    container_name: securecorp-ai-db
    restart: always
    environment:
      POSTGRES_USER: nexacore_admin
      POSTGRES_PASSWORD: nexacore_password0506
      POSTGRES_DB: nexacore_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexacore_admin -d nexacore_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: securecorp-ai-redis
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: securecorp-ai-backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - HYBRIDRAG_DATABASE_URL=postgresql://nexacore_admin:nexacore_password0506@db:5432/nexacore_db
      - HYBRIDRAG_REDIS_URL=redis://redis:6379/0
      - HYBRIDRAG_CHROMA_CLOUD=${HYBRIDRAG_CHROMA_CLOUD:-false}
      - HYBRIDRAG_CHROMA_API_KEY=${HYBRIDRAG_CHROMA_API_KEY:-}
      - HYBRIDRAG_CHROMA_SERVER_URL=${HYBRIDRAG_CHROMA_SERVER_URL:-}
      - HYBRIDRAG_CHROMA_TENANT=${HYBRIDRAG_CHROMA_TENANT:-}
      - HYBRIDRAG_CHROMA_DATABASE=${HYBRIDRAG_CHROMA_DATABASE:-securecorp}
      - HYBRIDRAG_GROQ_API_KEY=${HYBRIDRAG_GROQ_API_KEY:-}
      - HYBRIDRAG_OPENAI_API_KEY=${HYBRIDRAG_OPENAI_API_KEY:-}
      - HYBRIDRAG_JWT_SECRET=${HYBRIDRAG_JWT_SECRET:-dev-only-insecure-jwt-secret-change-me}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: ./web
      args:
        # NEXT_PUBLIC_API_BASE is inlined at build time. For browser access
        # from the host, the API must be reachable at this URL from the
        # *browser*, not from inside the compose network — hence localhost:8000
        # (the published backend port), not http://backend:8000.
        NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE:-http://localhost:8000}
    container_name: securecorp-ai-web
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    depends_on:
      - backend

volumes:
  postgres_data:
