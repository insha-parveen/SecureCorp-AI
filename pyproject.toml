[project]
name = "securecorp-ai-hybridrag"
version = "0.1.0"
description = "SecureCorp AI — Secure enterprise HybridRAG (BM25 + dense + RRF + cross-encoder reranking) over the NexaCore synthetic corpus"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "requests>=2.31.0",
    "psycopg[binary]>=3.1",
    "psycopg-pool>=3.1",
    "Faker>=24.0",
    "redis>=5.0",
    "rank-bm25>=0.2.2",
    "transformers>=5.14.1",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pyjwt>=2.8",
    "sse-starlette>=2.0",
]
retrieval = [
    "chromadb>=0.5",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=3.0",
]
evaluation = [
    "ragas>=0.1",
    "datasets>=2.0",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hybridrag"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# FastAPI's canonical idiom is ``Depends(...)`` as an argument default. B008
# flags it; allow it explicitly in the api/ package and any future route
# modules. Everything else still gets checked.
per-file-ignores = { "src/hybridrag/api/**/*.py" = ["B008"] }

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"

# rank_bm25, sentence_transformers, chromadb, and fastapi ship without
# (or with incomplete) type stubs. Scoped to those imports only so the
# rest of the codebase stays strictly checked.
[[tool.mypy.overrides]]
module = [
    "rank_bm25",
    "sentence_transformers",
    "sentence_transformers.*",
    "chromadb",
    "chromadb.*",
    "fastapi",
    "fastapi.*",
    "sse_starlette",
    "sse_starlette.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
