name: CI/CD Pipeline

on:
  push:
    branches: [ main, web-UI ]
  pull_request:
    branches: [ main ]

jobs:
  # Python Backend Tests
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        run: pip install uv

      - name: Install Dependencies
        run: uv sync --extra api --extra retrieval

      - name: Run Backend Tests
        run: uv run pytest tests/ -x -v --ignore=tests/evaluation --ignore=tests/security
        env:
          HYBRIDRAG_CHROMA_CLOUD: "false"
          HYBRIDRAG_CACHE_ENABLED: "false"

  # Frontend Lint and Test
  frontend-test:
    name: Frontend Test & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install Dependencies
        run: cd web && npm ci

      - name: Run Lint
        run: cd web && npm run lint

      - name: Run Type Check
        run: cd web && npm run typecheck

      - name: Run Tests
        run: cd web && npm test

  # Build for Production
  build:
    name: Build & Push Docker
    needs: [backend-test, frontend-test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Web App
        uses: docker/build-push-action@v5
        with:
          context: ./web
          file: ./web/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/securecorp-web:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/securecorp-web:${{ github.sha }}

      - name: Build and Push Backend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/securecorp-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/securecorp-backend:${{ github.sha }}

      - name: Deploy to Vercel
        if: github.ref == 'refs/heads/main'
        run: npx vercel --prod --token ${{ secrets.VERCEL_TOKEN }}

  # Railway Deployment
  railway:
    name: Railway Deploy
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Railway Deploy Backend
        run: railway up --service securecorp-backend
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      - name: Railway Deploy Web
        run: railway up --service securecorp-web
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
